services:
  redis:
    image: redis:7.4-alpine
    container_name: bip110-cache
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bitcoind-main:
    image: lncm/bitcoind:v26.0
    container_name: bitcoind-main
    ports:
      - "127.0.0.1:18443:18443"
      - "127.0.0.1:18445:18444" # P2P port
    command:
      - -regtest=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=user
      - -rpcpassword=password
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001

  bitcoind-bip110:
    image: ghcr.io/retropex/bitcoin:29.4.1.knots20260508rc4
    container_name: bitcoind-bip110
    ports:
      - "127.0.0.1:18444:18443" # RPC port
      - "127.0.0.1:18446:18444" # P2P port
    command:
      - -regtest=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=user
      - -rpcpassword=password
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -testactivationheight=blake2b@112
      - -blake2b_headline=splittoooor-regtest
